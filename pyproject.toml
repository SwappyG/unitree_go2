[project]
name = "just-robots"
version = "0.1.0"
description = "establish connection to unitree go2 and expose data over webrtc and http"
authors = []
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.poetry.dependencies]
go2-robot-sdk = { path = "go2_ros2_sdk/go2_robot_sdk", develop = true }
just-robots-firebase-admin-client = { path = "./firebase_admin_client", develop = true }
just-robots-firebase-client = { path = "./firebase_admin_client/firebase_client", develop = true }
pydantic = ">=2.12,<3"
PyYAML = ">=6.0,<7"
pycryptodome = ">=3.23,<4"
aiortc = "1.9"
requests = ">=2.32,<3"
av = "<17"
aiohttp = ">=3.13,<=4"
fastapi = { extras = ["standard"], version = ">=0.119,<1" }
opencv-python = ">=4.11,<5"
httpx = ">=0.28,<1"
qasync = "*"
PySide6 = ">=6.6,<7"
open3d = ">=0.19,<1"
vtk = "*"
keyboard = ">=0.13,<1"

[tool.poetry.group.dev.dependencies]
pytest = "^9"
pytest-asyncio = "^1.3"
pytest-qt = "^4.5"
ruff = "^0.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
